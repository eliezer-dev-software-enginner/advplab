name: Pull Request

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Checkout AdvPLab
        uses: actions/checkout@v7
        with:
          path: advplab

      - name: Checkout LivrePL
        uses: actions/checkout@v7
        with:
          repository: eliezer-dev-software-enginner/LivrePL
          path: livrePL

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: advplab/pyproject.toml

      - name: Install projects
        run: python -m pip install --upgrade pip && python -m pip install -e ./livrePL -e ./advplab

      - name: Run AdvPLab tests
        working-directory: advplab
        run: python -m unittest discover -s tests -v
